<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Colaborativo de Demandas</title>
    <link rel="stylesheet" href="../css/tecnico.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><h3>Demandas</h3></div>
        <nav>
            <button class="menu-item ativo" data-filtro-status="todos" data-filtro-categoria="todas">📋 Todas</button>
            <button class="menu-item" data-filtro-status="todos" data-filtro-categoria="ti">💻 Demandas de TI</button>
            <button class="menu-item" data-filtro-status="todos" data-filtro-categoria="geral">🛠️ Manutenção geral</button>
            <button class="menu-item" data-filtro-status="Pendente" data-filtro-categoria="todas">⏳ Pendentes</button>
            <button class="menu-item" data-filtro-status="Em Andamento" data-filtro-categoria="todas">⚡ Em andamento</button>
            <button class="menu-item" data-filtro-status="Concluído" data-filtro-categoria="ti">✅ Concluídas TI</button>
            <button class="menu-item" data-filtro-status="Concluído" data-filtro-categoria="geral">✅ Concluídas manutenção</button>
            <button class="menu-item" data-filtro-status="Cancelado" data-filtro-categoria="todas">❌ Canceladas</button>
            <button class="menu-item" id="btnEmprestimos">📦 Cesso de uso</button>
            <button class="menu-item" id="btnRelatorios">📊 Relatórios</button>
            <button class="menu-item sair" id="btnSair">🚪 Sair</button>
        </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <main class="conteudo-principal">
        <header>
            <button class="btn-toggle" id="btnToggleSidebar" aria-label="Abrir menu">☰</button>
            <div>
                <h1 id="tituloPagina">Todas as demandas</h1>
                <p id="nomeTecnico">Lendo sessão...</p>
            </div>
        </header>

        <div id="telaErro" class="alerta-erro" hidden></div>

        <section class="card-formulario">
            <h2>Novo chamado</h2>
            <form id="formDemanda">
                <div class="grid-formulario">
                    <label>Tipo de OS
                        <select id="tipoManutencao" required>
                            <option>Elétrica</option><option>Hidráulica</option><option>Patrimônio</option>
                            <option>Limpeza</option><option>Marcenaria</option><option>Alvenaria</option>
                            <option>Cobertura (Telhados)</option><option>Serralheria</option>
                            <option>Montagem de Mobiliário e Equipamentos</option>
                            <option>Geral</option><option>Outros</option><option>TI</option>
                        </select>
                    </label>
                    <label>Prioridade
                        <select id="prioridade" required><option selected>Normal</option><option>Alta</option><option>Crítico</option></select>
                    </label>
                </div>
                <label>Pesquisar escola / unidade
                    <input id="unidadeAtendida" list="listaEscolas" required autocomplete="off" placeholder="Digite o nome da escola">
                    <datalist id="listaEscolas"></datalist>
                </label>
                <label>Quem será atendido<input id="quemAtendido" maxlength="200"></label>
                <label>Descrição<textarea id="descricao" rows="3" maxlength="3000"></textarea></label>
                <button type="submit" class="btn-criar">Abrir chamado</button>
            </form>
        </section>

        <section class="barra-busca">
            <select id="filtroBusca" aria-label="Campo de busca">
                <option value="protocolo">Protocolo</option>
                <option value="prioridade">Prioridade</option>
                <option value="data">Data de solicitação</option>
            </select>
            <input id="inputBusca" type="search" placeholder="Número do protocolo">
            <button id="limparBusca" type="button">Limpar</button>
        </section>

        <section id="listaOrdens"><div class="estado-lista">Buscando demandas...</div></section>
    </main>

    <script type="module">
        import { db, auth } from '../src/config/firebase.js';
        import { collection, query, orderBy, onSnapshot, doc, getDoc, updateDoc, deleteDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const STATUS_PERMITIDOS = new Set(['Pendente', 'Em Andamento', 'Concluído', 'Cancelado']);
        const TIPOS_OS = ['Elétrica', 'Hidráulica', 'Patrimônio', 'Limpeza', 'Marcenaria', 'Alvenaria',
            'Cobertura (Telhados)', 'Serralheria', 'Montagem de Mobiliário e Equipamentos', 'Geral', 'Outros', 'TI'];
        const PRIORIDADES = ['Normal', 'Alta', 'Crítico'];
        const escapeHtml = (valor) => String(valor ?? '').replace(/[&<>'\"]/g, caractere => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[caractere]));
        const normalizar = (valor) => String(valor || '').trim().toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const prioridadeAtual = (valor) => valor === 'Baixa' || valor === 'Média' ? 'Normal' : valor || 'Normal';
        const optionsHtml = (opcoes, selecionada) => opcoes.map(opcao =>
            `<option value="${escapeHtml(opcao)}" ${opcao === selecionada ? 'selected' : ''}>${escapeHtml(opcao)}</option>`
        ).join('');

        let perfilUsuarioAtual = null;
        let demandas = [];
        const escolasDisponiveis = new Set();
        let filtroStatus = 'todos';
        let filtroCategoria = 'todas';

        function mostrarErro(mensagem) {
            const caixa = document.getElementById('telaErro');
            caixa.hidden = false;
            caixa.textContent = mensagem;
        }

        function fecharSidebar() {
            document.getElementById('sidebar').classList.remove('aberta');
            document.getElementById('sidebarBackdrop').classList.remove('visivel');
            document.body.classList.remove('menu-mobile-aberto');
        }

        document.getElementById('btnToggleSidebar').addEventListener('click', () => {
            const aberta = document.getElementById('sidebar').classList.toggle('aberta');
            document.getElementById('sidebarBackdrop').classList.toggle('visivel', aberta);
            document.body.classList.toggle('menu-mobile-aberto', aberta);
        });
        document.getElementById('sidebarBackdrop').addEventListener('click', fecharSidebar);

        document.querySelectorAll('.menu-item[data-filtro-status]').forEach(botao => {
            botao.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('ativo'));
                botao.classList.add('ativo');
                filtroStatus = botao.dataset.filtroStatus;
                filtroCategoria = botao.dataset.filtroCategoria;
                document.getElementById('tituloPagina').textContent = botao.textContent.trim();
                renderizarDemandas();
                fecharSidebar();
            });
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                mostrarErro('Sessão não encontrada. Entre novamente.');
                return;
            }
            try {
                const perfilDoc = await getDoc(doc(db, 'usuarios', user.uid));
                if (!perfilDoc.exists() || !String(perfilDoc.data().cargo || '').trim()) {
                    mostrarErro('Perfil sem cargo válido.');
                    return;
                }
                const perfil = perfilDoc.data();
                perfilUsuarioAtual = { uid: user.uid, nome: perfil.nome || user.displayName || 'Usuário', cargo: perfil.cargo };
                document.getElementById('nomeTecnico').textContent = `${perfilUsuarioAtual.nome} — ${perfilUsuarioAtual.cargo}`;
                inicializarUnidades();
                inicializarDemandas();
            } catch (error) {
                console.error('Falha ao validar perfil:', error);
                mostrarErro(`Falha ao validar perfil: ${error.code || 'erro-desconhecido'}`);
            }
        });

        function inicializarUnidades() {
            const lista = document.getElementById('listaEscolas');
            onSnapshot(query(collection(db, 'unidades')), snapshot => {
                const nomes = [];
                snapshot.forEach(item => { if (item.data().nome) nomes.push(item.data().nome); });
                nomes.sort((a, b) => a.localeCompare(b, 'pt-BR'));
                escolasDisponiveis.clear();
                nomes.forEach(nome => escolasDisponiveis.add(nome));
                lista.innerHTML = nomes.map(nome => `<option value="${escapeHtml(nome)}"></option>`).join('');
            }, error => {
                console.error('Erro ao carregar unidades:', error);
                mostrarErro('Falha ao carregar a lista de escolas.');
            });
        }

        function dataSolicitacao(demanda) {
            const valor = demanda.criado_em || demanda.prazo_limite || '';
            if (typeof valor !== 'string') return '';
            const data = new Date(valor.replace('Solicitado em:', '').trim());
            return Number.isNaN(data.getTime()) ? '' : data.toISOString().slice(0, 10);
        }

        function formatarData(demanda) {
            const dataIso = dataSolicitacao(demanda);
            if (!dataIso) return 'Não informada';
            return new Date(`${dataIso}T12:00:00`).toLocaleDateString('pt-BR');
        }

        function demandaAtendeFiltros(demanda) {
            const campo = document.getElementById('filtroBusca').value;
            const statusAlvo = filtroStatus !== 'todos' ? filtroStatus : campo === 'prioridade' ? 'Pendente' : null;
            if (statusAlvo && demanda.status !== statusAlvo) return false;
            const ehTi = normalizar(demanda.tipo_manutencao) === 'ti';
            if (filtroCategoria === 'ti' && !ehTi) return false;
            if (filtroCategoria === 'geral' && ehTi) return false;
            if (campo === 'prioridade') return true;
            const termo = normalizar(document.getElementById('inputBusca').value);
            if (!termo) return true;
            if (campo === 'data') return dataSolicitacao(demanda).includes(termo);
            return String(demanda.protocolo || '').includes(termo.replace('#', ''));
        }

        function renderizarDemandas() {
            const container = document.getElementById('listaOrdens');
            const filtradas = demandas.filter(demandaAtendeFiltros);
            if (document.getElementById('filtroBusca').value === 'prioridade') {
                const ordemPrioridade = { 'Crítico': 0, 'Alta': 1, 'Normal': 2, 'Média': 2, 'Baixa': 2 };
                filtradas.sort((a, b) => (ordemPrioridade[a.prioridade] ?? 3) - (ordemPrioridade[b.prioridade] ?? 3)
                    || Number(b.protocolo || 0) - Number(a.protocolo || 0));
            } else {
                const grupoStatus = status => status === 'Pendente' || status === 'Em Andamento' ? 0
                    : status === 'Concluído' ? 1 : status === 'Cancelado' ? 2 : 3;
                filtradas.sort((a, b) => grupoStatus(a.status) - grupoStatus(b.status)
                    || (grupoStatus(a.status) === 0
                        ? Number(a.protocolo || 0) - Number(b.protocolo || 0)
                        : Number(b.protocolo || 0) - Number(a.protocolo || 0)));
            }
            if (!filtradas.length) {
                container.innerHTML = '<div class="estado-lista">Nenhuma demanda encontrada.</div>';
                return;
            }
            container.innerHTML = filtradas.map(d => {
                const corStatus = d.status === 'Concluído' ? 'var(--status-concluido)'
                    : d.status === 'Cancelado' ? 'var(--status-cancelado)'
                    : d.status === 'Em Andamento' ? 'var(--status-andamento)' : 'var(--status-pendente)';
                const alteradoPor = d.status_alterado_por?.nome
                    ? `${d.status_alterado_por.nome} (${d.status_alterado_por.cargo || 'cargo não informado'})` : 'Não registrado';
                return `<article class="card-demanda" data-id="${escapeHtml(d.idDoc)}">
                    <div class="header-demanda"><span class="protocolo">#${escapeHtml(d.protocolo)}</span><span class="badge" style="background:${corStatus}">${escapeHtml(d.status)}</span></div>
                    <div class="grid-edicao">
                        <label>Prioridade<select data-campo="prioridade">${optionsHtml(PRIORIDADES, prioridadeAtual(d.prioridade))}</select></label>
                        <label>Tipo de OS<select data-campo="tipo_manutencao">${optionsHtml(TIPOS_OS, d.tipo_manutencao || 'Geral')}</select></label>
                        <label class="campo-largo">Instituição<input data-campo="unidade_atendida" maxlength="200" value="${escapeHtml(d.unidade_atendida)}"></label>
                    </div>
                    <div class="detalhe"><b>Solicitado em:</b> ${escapeHtml(formatarData(d))}</div>
                    <div class="detalhe"><b>Atendido:</b> ${escapeHtml(d.quem_atendido || 'Não informado')}</div>
                    <div class="caixa-descricao"><b>Solicitação:</b><br>${escapeHtml(d.descricao || 'Sem descrição.')}</div>
                    <label class="parecer-label">Parecer técnico<textarea data-campo="observacao_tecnico" rows="3" maxlength="5000">${escapeHtml(d.observacao_tecnico)}</textarea></label>
                    <div class="detalhe"><b>Última alteração:</b> ${escapeHtml(alteradoPor)}</div>
                    <button class="btn-salvar" data-acao="salvar" data-demanda-id="${escapeHtml(d.idDoc)}">Salvar edição</button>
                    <div class="acoes-grupo">
                        <button class="btn-acao pendente" data-acao="status" data-demanda-id="${escapeHtml(d.idDoc)}" data-novo-status="Pendente">Pendente</button>
                        <button class="btn-acao andamento" data-acao="status" data-demanda-id="${escapeHtml(d.idDoc)}" data-novo-status="Em Andamento">Iniciar</button>
                        <button class="btn-acao concluido" data-acao="status" data-demanda-id="${escapeHtml(d.idDoc)}" data-novo-status="Concluído">Concluir</button>
                        <button class="btn-acao cancelado" data-acao="status" data-demanda-id="${escapeHtml(d.idDoc)}" data-novo-status="Cancelado">Cancelar</button>
                    </div>
                    <button class="btn-excluir" data-acao="excluir" data-demanda-id="${escapeHtml(d.idDoc)}" data-protocolo="${escapeHtml(d.protocolo)}">Excluir demanda</button>
                </article>`;
            }).join('');
        }

        function inicializarDemandas() {
            onSnapshot(query(collection(db, 'demandas'), orderBy('protocolo', 'desc')), snapshot => {
                demandas = snapshot.docs.map(item => ({ idDoc: item.id, ...item.data() }));
                renderizarDemandas();
            }, error => {
                console.error('Erro ao carregar demandas:', error);
                mostrarErro(`Erro ao carregar demandas: ${error.code || 'erro-desconhecido'}`);
            });
        }

        function dadosEditados(idDoc) {
            const card = document.querySelector(`.card-demanda[data-id="${CSS.escape(idDoc)}"]`);
            return {
                card,
                prioridade: card.querySelector('[data-campo="prioridade"]').value,
                tipo_manutencao: card.querySelector('[data-campo="tipo_manutencao"]').value,
                unidade_atendida: card.querySelector('[data-campo="unidade_atendida"]').value.trim(),
                observacao_tecnico: card.querySelector('[data-campo="observacao_tecnico"]').value.trim()
            };
        }

        async function salvarEdicao(idDoc, novoStatus = null) {
            if (!perfilUsuarioAtual) return;
            const dados = dadosEditados(idDoc);
            if (!dados.unidade_atendida) return alert('Informe a instituição.');
            if ((novoStatus === 'Concluído' || novoStatus === 'Cancelado') && !dados.observacao_tecnico) {
                return alert('Preencha o parecer técnico para concluir ou cancelar.');
            }
            const payload = {
                prioridade: dados.prioridade,
                tipo_manutencao: dados.tipo_manutencao,
                unidade_atendida: dados.unidade_atendida,
                observacao_tecnico: dados.observacao_tecnico,
                status_alterado_por: perfilUsuarioAtual,
                status_alterado_em: serverTimestamp()
            };
            if (novoStatus) payload.status = novoStatus;
            if (novoStatus === 'Concluído' || novoStatus === 'Cancelado') payload.concluido_em = new Date().toISOString();
            try {
                await updateDoc(doc(db, 'demandas', idDoc), payload);
                alert(novoStatus ? `Status alterado para ${novoStatus}.` : 'Demanda atualizada.');
            } catch (error) {
                console.error('Falha ao atualizar demanda:', error);
                alert(`Falha ao atualizar: ${error.code || 'erro-desconhecido'}`);
            }
        }

        async function excluirDemanda(idDoc, protocolo) {
            const confirmado = confirm(`Excluir permanentemente a demanda #${protocolo}?\n\nEsta ação não pode ser desfeita.`);
            if (!confirmado) return;
            try {
                await deleteDoc(doc(db, 'demandas', idDoc));
                alert(`Demanda #${protocolo} excluída.`);
            } catch (error) {
                console.error('Falha ao excluir demanda:', error);
                alert(`Falha ao excluir: ${error.code || 'erro-desconhecido'}`);
            }
        }

        document.addEventListener('click', event => {
            const botao = event.target.closest('[data-acao][data-demanda-id]');
            if (!botao) return;
            if (botao.dataset.acao === 'excluir') {
                excluirDemanda(botao.dataset.demandaId, botao.dataset.protocolo);
                return;
            }
            salvarEdicao(botao.dataset.demandaId, botao.dataset.acao === 'status' ? botao.dataset.novoStatus : null);
        });

        document.getElementById('formDemanda').addEventListener('submit', async event => {
            event.preventDefault();
            if (!perfilUsuarioAtual) return;
            const escolaSelecionada = document.getElementById('unidadeAtendida').value.trim();
            if (!escolasDisponiveis.has(escolaSelecionada)) return alert('Selecione uma escola cadastrada na lista.');
            const payload = {
                tipo_manutencao: document.getElementById('tipoManutencao').value,
                unidade_atendida: escolaSelecionada,
                quem_atendido: document.getElementById('quemAtendido').value.trim(),
                prioridade: document.getElementById('prioridade').value,
                descricao: document.getElementById('descricao').value.trim(),
                status: 'Pendente', prazo_limite: new Date().toISOString(), observacao_tecnico: '',
                status_alterado_por: perfilUsuarioAtual, status_alterado_em: serverTimestamp()
            };
            try {
                let protocolo;
                await runTransaction(db, async transaction => {
                    const contadorRef = doc(db, 'configuracoes', 'contador_protocolo');
                    const contadorDoc = await transaction.get(contadorRef);
                    protocolo = contadorDoc.exists() ? Number(contadorDoc.data().ultimo_numero || 999) + 1 : 1000;
                    transaction.set(contadorRef, { ultimo_numero: protocolo }, { merge: true });
                    transaction.set(doc(collection(db, 'demandas')), { ...payload, protocolo });
                });
                alert(`Chamado #${protocolo} aberto.`);
                event.target.reset();
            } catch (error) {
                console.error('Erro ao abrir chamado:', error);
                alert(`Falha ao abrir chamado: ${error.code || 'erro-desconhecido'}`);
            }
        });

        function configurarCampoBusca() {
            const campo = document.getElementById('filtroBusca').value;
            const input = document.getElementById('inputBusca');
            input.value = '';
            input.type = campo === 'data' ? 'date' : 'search';
            input.disabled = campo === 'prioridade';
            input.placeholder = campo === 'prioridade' ? 'Pendentes: Crítico, Alta e Normal' : campo === 'data' ? '' : 'Número do protocolo';
            renderizarDemandas();
        }
        document.getElementById('filtroBusca').addEventListener('change', configurarCampoBusca);
        document.getElementById('inputBusca').addEventListener('input', renderizarDemandas);
        document.getElementById('limparBusca').addEventListener('click', () => { document.getElementById('inputBusca').value = ''; renderizarDemandas(); });
        document.getElementById('btnEmprestimos').addEventListener('click', () => { window.location.href = 'emprestimos.html'; });
        document.getElementById('btnRelatorios').addEventListener('click', () => { window.location.href = 'relatorios.html'; });
        document.getElementById('btnSair').addEventListener('click', () => signOut(auth).then(() => { window.location.href = '../index.html'; }));
    </script>
</body>
</html>
